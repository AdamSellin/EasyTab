# cargo-deny: known vulnerabilities, licenses and crate sources of the
# dependencies. Run locally with `cargo deny check` (`cargo install cargo-deny`).

[graph]
# Released targets: platform-specific dependencies are checked too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# RustSec advisories to accept, each with a reason.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, not vulnerable; build-time only, through gtk3-macros (wry on Linux). Goes away when wry moves past GTK 3." },
]

[licenses]
version = 2
# Licenses compatible with shipping EasyTab under MIT.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# GTK, tao and wry pull several versions of some crates: not worth failing on.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
