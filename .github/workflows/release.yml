name: Release

# Publie une version quand un tag `v*` est poussé (ex. `git tag v0.2.0 && git push origin v0.2.0`),
# ou à la main depuis l'onglet Actions avec le nom de la version : le tag est
# alors créé sur le commit choisi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à publier (ex. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Les programmes affichent et comparent (easytab update) le numéro du tag.
      - name: Numéro de version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"$/version = \"${TAG#v}\"/" Cargo.toml
          cargo update --workspace
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          name=easytab-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/easytab target/${{ matrix.target }}/release/easytab-term README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "easytab-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/easytab.exe, target/${{ matrix.target }}/release/easytab-term.exe, target/${{ matrix.target }}/release/easytab-overlay.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: easytab-${{ matrix.target }}
          path: easytab-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* scripts/install.sh scripts/install.ps1 \
            --target "$GITHUB_SHA" --title "EasyTab $TAG" --generate-notes
