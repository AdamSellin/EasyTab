[package]
name = "easytab-overlay"
description = "Fenêtre flottante qui affiche les suggestions d'EasyTab sous le curseur"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Partie commune : la fenêtre (tao) et la page qui dessine la liste (wry).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
anyhow.workspace = true
dirs.workspace = true
tao = "0.37"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = "0.13"
