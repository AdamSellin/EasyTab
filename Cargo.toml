[workspace]
resolver = "2"
members = ["crates/easytab-core", "crates/easytab-term", "crates/easytab-cli", "crates/easytab-overlay"]

[workspace.package]
version = "0.1.11"
edition = "2021"
# Oldest supported Rust, checked by the `msrv` CI job.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/AdamSellin/EasyTab"

[workspace.dependencies]
easytab-core = { path = "crates/easytab-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
embed-resource = "3"
portable-pty = "0.9"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
miniz_oxide = "0.8"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
unicode-width = "0.2"
vt100 = "0.16"
